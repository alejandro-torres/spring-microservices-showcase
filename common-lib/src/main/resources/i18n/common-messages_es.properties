# Mensajes de error comunes. Este fichero base está en español y es el idioma por defecto.
# Formato MessageFormat: las comillas simples se escriben dobles ('').
error.default=Se ha producido un error al procesar la petición.

error.VALIDATION_ERROR=La petición contiene datos no válidos.
error.MALFORMED_REQUEST=El cuerpo de la petición no es válido o está mal formado.
error.INVALID_PARAMETER=El parámetro ''{0}'' tiene un valor no válido: {1}.
error.MISSING_PARAMETER=Falta el parámetro obligatorio ''{0}''.
error.INVALID_PAGINATION=Parámetro de paginación no válido: {0} = {1}.
error.INVALID_FILTER_FORMAT=El filtro ''{0}'' no tiene el formato campo:operador:valor.
error.FILTER_FIELD_NOT_ALLOWED=No se puede filtrar por ''{0}''. Campos permitidos: {1}.
error.FILTER_OPERATOR_NOT_ALLOWED=El operador ''{0}'' no está permitido en el campo ''{1}''. Operadores permitidos: {2}.
error.INVALID_FILTER_VALUE=El valor ''{1}'' no es válido para el filtro del campo ''{0}''.
error.TOO_MANY_FILTERS=Se permiten como máximo {0} filtros por petición.
error.METHOD_NOT_ALLOWED=El método {0} no está permitido en esta ruta.
error.NOT_ACCEPTABLE=No se puede generar la respuesta en el formato solicitado.
error.UNSUPPORTED_MEDIA_TYPE=El tipo de contenido {0} no está soportado.
error.UNAUTHORIZED=Es necesario autenticarse para acceder a este recurso.
error.INVALID_TOKEN=El token de acceso no es válido, ha caducado o ha sido revocado.
error.FORBIDDEN=No tienes permiso para realizar esta operación.
error.RESOURCE_NOT_FOUND=No se ha encontrado el recurso {0} con id {1}.
error.ENDPOINT_NOT_FOUND=La ruta {0} no existe.
error.DATA_CONFLICT=La operación entra en conflicto con datos existentes.
error.CONCURRENT_MODIFICATION=Otro usuario ha modificado este recurso. Vuelve a cargarlo e inténtalo de nuevo.
error.RATE_LIMIT_EXCEEDED=Has superado el límite de peticiones. Inténtalo de nuevo más tarde.
error.RESOURCE_BUSY=El recurso {0} está siendo modificado por otra petición. Inténtalo de nuevo en unos segundos.
error.SERVICE_UNAVAILABLE=El servicio no está disponible en este momento. Inténtalo de nuevo más tarde.
error.INTERNAL_ERROR=Error interno del servidor.

# Validaciones de Bean Validation: {0} es el campo y el resto, los atributos de la anotación por orden alfabético.
NotNull=es obligatorio
NotBlank=es obligatorio y no puede estar vacío
NotEmpty=no puede estar vacío
Size=debe tener entre {2} y {1} caracteres
Min=debe ser mayor o igual que {1}
Max=debe ser menor o igual que {1}
DecimalMin=debe ser mayor o igual que {2}
DecimalMax=debe ser menor o igual que {2}
Positive=debe ser mayor que 0
PositiveOrZero=debe ser mayor o igual que 0
Email=no es un email válido
Pattern=no tiene un formato válido
Past=debe ser una fecha pasada
Future=debe ser una fecha futura
typeMismatch=tiene un tipo de dato no válido
