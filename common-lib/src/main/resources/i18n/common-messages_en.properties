# Common error messages in English.
error.default=An error occurred while processing the request.

error.VALIDATION_ERROR=The request contains invalid data.
error.MALFORMED_REQUEST=The request body is invalid or malformed.
error.INVALID_PARAMETER=Parameter ''{0}'' has an invalid value: {1}.
error.MISSING_PARAMETER=Required parameter ''{0}'' is missing.
error.INVALID_PAGINATION=Invalid pagination parameter: {0} = {1}.
error.INVALID_FILTER_FORMAT=Filter ''{0}'' does not follow the field:operator:value format.
error.FILTER_FIELD_NOT_ALLOWED=Filtering by ''{0}'' is not allowed. Allowed fields: {1}.
error.FILTER_OPERATOR_NOT_ALLOWED=Operator ''{0}'' is not allowed on field ''{1}''. Allowed operators: {2}.
error.INVALID_FILTER_VALUE=Value ''{1}'' is not valid for the filter on field ''{0}''.
error.TOO_MANY_FILTERS=At most {0} filters are allowed per request.
error.METHOD_NOT_ALLOWED=Method {0} is not allowed on this path.
error.NOT_ACCEPTABLE=The response cannot be produced in the requested format.
error.UNSUPPORTED_MEDIA_TYPE=Content type {0} is not supported.
error.UNAUTHORIZED=Authentication is required to access this resource.
error.INVALID_TOKEN=The access token is invalid, expired or revoked.
error.FORBIDDEN=You do not have permission to perform this operation.
error.RESOURCE_NOT_FOUND={0} with id {1} was not found.
error.ENDPOINT_NOT_FOUND=Path {0} does not exist.
error.DATA_CONFLICT=The operation conflicts with existing data.
error.CONCURRENT_MODIFICATION=This resource was modified by another user. Reload it and try again.
error.RATE_LIMIT_EXCEEDED=You have exceeded the request limit. Please try again later.
error.SERVICE_UNAVAILABLE=The service is currently unavailable. Please try again later.
error.INTERNAL_ERROR=Internal server error.

NotNull=is required
NotBlank=is required and cannot be blank
NotEmpty=cannot be empty
Size=must be between {2} and {1} characters long
Min=must be greater than or equal to {1}
Max=must be less than or equal to {1}
DecimalMin=must be greater than or equal to {2}
DecimalMax=must be less than or equal to {2}
Positive=must be greater than 0
PositiveOrZero=must be greater than or equal to 0
Email=is not a valid email
Pattern=has an invalid format
Past=must be a date in the past
Future=must be a date in the future
typeMismatch=has an invalid data type
