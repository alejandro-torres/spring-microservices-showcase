server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  messages:
    fallback-to-system-locale: false
  # Restaura el contexto de la traza en cada operador reactivo (logs con traceId aunque cambie el hilo).
  reactor:
    context-propagation: auto
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clave pública de auth-service para validar los JWT (se descarga y se cachea).
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  cloud:
    gateway:
      server:
        webflux:
          filter:
            request-rate-limiter:
              # Al superar el límite se lanza una excepción en lugar de devolver un 429 vacío: así el
              # GatewayErrorWebExceptionHandler responde en el formato común y con Retry-After.
              throw-on-limit: true
          # Para todas las rutas: 20 peticiones por segundo con ráfagas de 40, por usuario o por IP.
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
                redis-rate-limiter.requestedTokens: 1
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowed-methods: GET,POST,PUT,DELETE,OPTIONS
                allowed-headers: "*"
                exposed-headers: X-Trace-Id,Retry-After,Location,X-RateLimit-Remaining
                allow-credentials: true
                max-age: 3600
          routes:
            # Login: 5 intentos por minuto y por IP. Cada petición gasta 12 fichas y el cubo recupera 1 por
            # segundo (5 por minuto), con capacidad para 5 seguidas (60 fichas).
            - id: auth-login
              uri: lb://auth-service
              predicates:
                - Path=/login,/oauth2/token
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${LOGIN_RATE_LIMIT_REPLENISH_RATE:1}
                    redis-rate-limiter.burstCapacity: ${LOGIN_RATE_LIMIT_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: ${LOGIN_RATE_LIMIT_REQUESTED_TOKENS:12}
                - name: CircuitBreaker
                  args:
                    name: auth-service
                    fallbackUri: forward:/fallback/auth-service
            # Formulario de login y endpoints OAuth2 (autorización, JWKS, configuración OpenID).
            - id: auth-oauth2
              uri: lb://auth-service
              predicates:
                - Path=/login,/logout,/oauth2/**,/.well-known/**,/userinfo,/connect/**
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions/**,/api/v1/security-audit/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service
                    fallbackUri: forward:/fallback/auth-service
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: product-service
                    fallbackUri: forward:/fallback/product-service
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: customer-service
                    fallbackUri: forward:/fallback/customer-service
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: order-service
                    fallbackUri: forward:/fallback/order-service
            # Las DLQ existen en varios servicios con la misma ruta: el gateway las distingue por un prefijo.
            # /api/v1/admin/order-service/dead-letters/** → order-service /api/v1/admin/dead-letters/**
            - id: dead-letters-order
              uri: lb://order-service
              predicates:
                - Path=/api/v1/admin/order-service/dead-letters/**
              filters:
                - RewritePath=/api/v1/admin/order-service/(?<rest>.*), /api/v1/admin/$\{rest}
            - id: dead-letters-product
              uri: lb://product-service
              predicates:
                - Path=/api/v1/admin/product-service/dead-letters/**
              filters:
                - RewritePath=/api/v1/admin/product-service/(?<rest>.*), /api/v1/admin/$\{rest}
            - id: dead-letters-customer
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/admin/customer-service/dead-letters/**
              filters:
                - RewritePath=/api/v1/admin/customer-service/(?<rest>.*), /api/v1/admin/$\{rest}
            # Documentación OpenAPI de cada servicio para el Swagger UI agregado: /{servicio}/v3/api-docs.
            - id: docs-auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth-service/v3/api-docs
              filters:
                - RewritePath=/auth-service/v3/api-docs, /v3/api-docs
            - id: docs-product-service
              uri: lb://product-service
              predicates:
                - Path=/product-service/v3/api-docs
              filters:
                - RewritePath=/product-service/v3/api-docs, /v3/api-docs
            - id: docs-customer-service
              uri: lb://customer-service
              predicates:
                - Path=/customer-service/v3/api-docs
              filters:
                - RewritePath=/customer-service/v3/api-docs, /v3/api-docs
            - id: docs-order-service
              uri: lb://order-service
              predicates:
                - Path=/order-service/v3/api-docs
              filters:
                - RewritePath=/order-service/v3/api-docs, /v3/api-docs
  lifecycle:
    timeout-per-shutdown-phase: 30s

# Un único Swagger UI con un desplegable para la API de cada servicio.
springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: product-service
        url: /product-service/v3/api-docs
      - name: customer-service
        url: /customer-service/v3/api-docs
      - name: order-service
        url: /order-service/v3/api-docs

# Circuit breaker por ruta: con la mitad de las últimas 20 llamadas fallidas se abre 10 s y responde 503 al
# instante. Una llamada que tarda más de 5 s cuenta como fallo.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: ${GATEWAY_TIMEOUT:5s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
