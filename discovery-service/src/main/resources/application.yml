server:
  port: ${SERVER_PORT:8761}
  shutdown: graceful

spring:
  application:
    name: discovery-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # It is the registry itself: it does not register with itself or download another's registry.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Removes right away the replicas that stop sending heartbeats (with few replicas, Eureka's
    # self-preservation would keep them registered and the gateway would keep sending them traffic).
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 3000

management:
  metrics:
    # Common tags of all metrics: service, replica (the same as X-Instance-Id) and environment.
    tags:
      application: ${spring.application.name}
      instance: ${HOSTNAME:discovery-service}
      environment: ${ENVIRONMENT:dev}
    distribution:
      # Latency histogram to compute p50/p95/p99 in Prometheus; with traces, each bucket carries an
      # exemplar with the traceId of a real request (to jump from the chart to Zipkin).
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
