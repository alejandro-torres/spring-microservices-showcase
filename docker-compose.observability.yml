# Observabilidad: Prometheus (métricas y alertas), Loki + Grafana Alloy (logs) y Grafana (dashboards).
# Se levanta junto al sistema:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
# Consolas: Grafana http://localhost:3000 (usuario admin, contraseña admin o la de .env) y
# Prometheus http://localhost:9090.
# RabbitMQ ya publica sus métricas (colas, DLQ, consumidores) en el puerto 15692 de la red interna.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Guarda los exemplars (traceId de peticiones concretas) para saltar de una gráfica a su traza.
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      discovery-service:
        condition: service_healthy

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  # Lee los logs de todos los contenedores del proyecto por el socket de Docker y los envía a Loki.
  alloy:
    image: grafana/alloy:v1.10.0
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_LANGUAGE: es-ES
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-overview.json
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - zipkin

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
