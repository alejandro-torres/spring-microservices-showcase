# Observability: Prometheus (metrics and alerts), Loki + Grafana Alloy (logs) and Grafana (dashboards).
# Started together with the system:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
# Consoles: Grafana http://localhost:3000 (user admin, password admin or the one in .env) and
# Prometheus http://localhost:9090.
# RabbitMQ already publishes its metrics (queues, DLQ, consumers) on port 15692 of the internal network.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Stores the exemplars (traceId of specific requests) to jump from a chart to its trace.
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      discovery-service:
        condition: service_healthy

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  # Reads the logs of all the project's containers through the Docker socket and sends them to Loki.
  alloy:
    image: grafana/alloy:v1.10.0
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_LANGUAGE: en-US
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-overview.json
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - zipkin

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
