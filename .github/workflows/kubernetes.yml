name: Kubernetes

# Deploys the full system to a kind cluster (the same scripts as locally) and runs the e2e tests through the Ingress
# over HTTPS: checks that the chart, the NetworkPolicies, the non-root containers and the Kubernetes configuration
# keep working with each change.
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e on kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install kind and kubectl
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true

      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Create the cluster (1 control-plane + 2 workers)
        run: k8s/kind/cluster.sh create

      - name: Install Traefik, cert-manager and metrics-server
        run: k8s/platform/install.sh

      - name: Build the images and deploy the chart
        run: k8s/deploy.sh

      - name: Run the e2e tests against https://showcase.localhost
        run: k8s/e2e.sh -B -ntp

      - name: Cluster state if something fails
        if: failure()
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A -o wide
          kubectl -n showcase get events --sort-by=.lastTimestamp | tail -50
          for pod in $(kubectl -n showcase get pods -o name); do
            echo "::group::$pod"
            kubectl -n showcase describe "$pod" | tail -30
            kubectl -n showcase logs "$pod" --all-containers --tail=100 || true
            echo "::endgroup::"
          done

      - name: Save the e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-e2e-kubernetes
          path: e2e-tests/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
