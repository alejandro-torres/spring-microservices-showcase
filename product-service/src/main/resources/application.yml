server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  # Respeta las cabeceras X-Forwarded-* del gateway (URLs de Swagger, Location de los 201...).
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: product-service
  messages:
    # messages.properties está en español; sin esto un servidor en otro idioma usaría su locale como respaldo.
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USERNAME:product}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clave pública de auth-service para validar los JWT (se descarga y se cachea).
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  # Redis para los locks distribuidos (Redisson), el mismo que usan el gateway y auth-service.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # guest/guest solo sirve en local; en docker-compose cada servicio tiene su propio usuario.
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # El outbox solo da un evento por enviado si RabbitMQ confirma que lo ha recibido (confirm) y que tenía
    # una cola de destino (return con mandatory).
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        # ACK automático cuando el listener termina sin excepción (después del commit del servicio).
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 1
        max-concurrency: 4
        # Un mensaje rechazado no vuelve a la cola: va a su DLQ.
        default-requeue-rejected: false
        observation-enabled: true
        retry:
          enabled: true
          # 1 intento + 3 reintentos esperando 1 s, 2 s y 4 s; después, a la DLQ.
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s
  lifecycle:
    timeout-per-shutdown-phase: 30s

showcase:
  lock:
    # Espera máxima a que otra réplica suelte el lock de un producto (después, RESOURCE_BUSY y reintento) y
    # caducidad del lock por si la réplica que lo tiene muere.
    wait-time: 3s
    lease-time: 10s
  messaging:
    # Los eventos procesados se guardan 7 días (para descartar duplicados); después los borra una tarea nocturna.
    processed-event-retention: 7d
    source: ${spring.application.name}
    exchange: product.events
    consumers:
      order-created:
        queue: product-service.order-created
        exchange: order.events
        routing-key: order.created
      order-cancelled:
        queue: product-service.order-cancelled
        exchange: order.events
        routing-key: order.cancelled

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Lista de réplicas refrescada cada 5 s (por defecto 30 s).
    registry-fetch-interval-seconds: 5
  instance:
    # Id único de cada réplica, calculado una vez al arrancar (common-lib); es el mismo que la cabecera
    # X-Instance-Id de las respuestas.
    instance-id: ${showcase.instance-id}
    prefer-ip-address: true
    # Latido cada 5 s; si faltan durante 15 s, Eureka retira la réplica.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    # Prometheus descubre las réplicas en Eureka y lee aquí en qué puerto están sus métricas.
    metadata-map:
      prometheus-port: ${management.server.port:${server.port}}

# Cada consulta SQL es un span en Zipkin (sin los valores de los parámetros, que pueden ser datos personales).
jdbc:
  includes: connection, query
  datasource-proxy:
    include-parameter-values: false

management:
  metrics:
    # Etiquetas comunes de todas las métricas: servicio, réplica (la misma de X-Instance-Id) y entorno.
    tags:
      application: ${spring.application.name}
      instance: ${showcase.instance-id}
      environment: ${ENVIRONMENT:dev}
    distribution:
      # Histograma de latencias para calcular p50/p95/p99 en Prometheus; con trazas, cada cubo lleva un
      # exemplar con el traceId de una petición real (para saltar de la gráfica a Zipkin).
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    annotations:
      # Spans propios con @Observed en los casos de uso clave (se ven en Zipkin dentro de la petición).
      enabled: true
  tracing:
    sampling:
      # 10 % por defecto (prod); el perfil dev muestrea el 100 %.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
