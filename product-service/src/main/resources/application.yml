server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: product-service
  messages:
    # messages.properties está en español; sin esto un servidor en otro idioma usaría su locale como respaldo.
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USERNAME:product}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clave pública de auth-service para validar los JWT (se descarga y se cachea).
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # guest/guest solo sirve en local; en docker-compose cada servicio tiene su propio usuario.
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # El outbox solo da un evento por enviado si RabbitMQ confirma que lo ha recibido (confirm) y que tenía
    # una cola de destino (return con mandatory).
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        # ACK automático cuando el listener termina sin excepción (después del commit del servicio).
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 1
        max-concurrency: 4
        # Un mensaje rechazado no vuelve a la cola: va a su DLQ.
        default-requeue-rejected: false
        observation-enabled: true
        retry:
          enabled: true
          # 1 intento + 3 reintentos esperando 1 s, 2 s y 4 s; después, a la DLQ.
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s
  lifecycle:
    timeout-per-shutdown-phase: 30s

showcase:
  messaging:
    source: ${spring.application.name}
    exchange: product.events
    consumers:
      order-created:
        queue: product-service.order-created
        exchange: order.events
        routing-key: order.created
      order-cancelled:
        queue: product-service.order-cancelled
        exchange: order.events
        routing-key: order.cancelled

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
