# Mensajes de error de product-service. Este fichero base está en español (idioma por defecto).
# Formato MessageFormat: las comillas simples se escriben dobles ('').
error.PRODUCT_NOT_FOUND=No existe ningún producto activo con id {0}.
error.CATEGORY_NOT_FOUND=No existe ninguna categoría activa con id {0}.
error.PRODUCT_ALREADY_EXISTS=Ya existe un producto llamado ''{0}''.
error.CATEGORY_ALREADY_EXISTS=Ya existe una categoría llamada ''{0}''.
error.CATEGORY_HAS_PRODUCTS=La categoría ''{0}'' tiene productos activos y no se puede borrar.
error.INSUFFICIENT_STOCK=No hay stock suficiente de ''{0}'': disponibles {1}, solicitadas {2}.
error.INVALID_PRODUCT_NAME=El nombre de producto ''{0}'' no es válido: debe tener entre 2 y 120 caracteres.
error.INVALID_CATEGORY_NAME=El nombre de categoría ''{0}'' no es válido: debe tener entre 2 y 60 caracteres.
error.INVALID_PRICE=El precio {0} no es válido: debe ser mayor que 0, con 2 decimales como máximo.
error.INVALID_QUANTITY=La cantidad {0} no es válida.
