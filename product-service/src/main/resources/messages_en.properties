# product-service error messages in English.
error.PRODUCT_NOT_FOUND=No active product with id {0} was found.
error.CATEGORY_NOT_FOUND=No active category with id {0} was found.
error.PRODUCT_ALREADY_EXISTS=A product named ''{0}'' already exists.
error.CATEGORY_ALREADY_EXISTS=A category named ''{0}'' already exists.
error.CATEGORY_HAS_PRODUCTS=Category ''{0}'' has active products and cannot be deleted.
error.INSUFFICIENT_STOCK=Not enough stock of ''{0}'': {1} available, {2} requested.
error.INVALID_PRODUCT_NAME=Product name ''{0}'' is not valid: it must be 2 to 120 characters long.
error.INVALID_CATEGORY_NAME=Category name ''{0}'' is not valid: it must be 2 to 60 characters long.
error.INVALID_PRICE=Price {0} is not valid: it must be greater than 0 with at most 2 decimals.
error.INVALID_QUANTITY=Quantity {0} is not valid.
