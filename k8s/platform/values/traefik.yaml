# Traefik as the Ingress controller (ingress-nginx has been archived since March 2026 and no longer gets patches).
# It uses standard Ingress resources: switching controllers only changes ingressClassName.
#
# In kind it runs on the control-plane, the node with host ports 80 and 443 mapped (kind-config.yaml).
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

ports:
  web:
    hostPort: 80
    # All HTTP traffic is redirected to HTTPS.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    hostPort: 443

service:
  type: ClusterIP

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }
