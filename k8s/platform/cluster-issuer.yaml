# Certificates for the local cluster with cert-manager: its own self-signed CA (showcase-ca) signs the
# Ingress certificates. For the browser or Java to trust them, just import that CA
# (kubectl -n cert-manager get secret showcase-ca -o jsonpath='{.data.ca\.crt}').
# In production it is replaced by a real issuer, such as Let's Encrypt (ACME).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: showcase-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Showcase local CA
  secretName: showcase-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: showcase-ca
spec:
  ca:
    secretName: showcase-ca
