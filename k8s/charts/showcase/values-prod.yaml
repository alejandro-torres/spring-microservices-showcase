# Values for a real cluster with managed PostgreSQL, Redis and RabbitMQ (for example Amazon RDS / ElastiCache /
# Amazon MQ, Cloud SQL / Memorystore or Azure Database / Azure Cache). They combine with values.yaml:
#
#   helm upgrade --install showcase k8s/charts/showcase -n showcase --create-namespace \
#     -f k8s/charts/showcase/values-prod.yaml --set image.tag=<version>
#
# Before installing (see docs/kubernetes.md):
#   - In the database: one user and one database per service, as in docker/postgres/init-databases.sh
#     (auth/auth_db, product/product_db, customer/customer_db, order/order_db).
#   - In RabbitMQ: one user per service with the permissions of docker/rabbitmq/setup-users.sh.
#   - The Secrets of each microservice (secrets.create: false), with the same keys the chart creates:
#     DB_PASSWORD, RABBITMQ_PASSWORD, SPRING_DATA_REDIS_PASSWORD and, in auth-service, INTERNAL_CLIENT_SECRET,
#     JWT_PRIVATE_KEY and JWT_PUBLIC_KEY. The usual way is to create them with External Secrets from the cloud's
#     secret manager, so that no password goes through Git or the command line.
#   - Ingress controller, cert-manager with a Let's Encrypt ClusterIssuer and metrics-server (k8s/platform serves as a
#     reference), and observability (k8s/observability) if you want the same as locally.

image:
  # Registry where CI publishes the images; the version is set on each deployment (--set image.tag=...).
  repository: registry.example.com/showcase
  tag: ""
  pullPolicy: IfNotPresent

# prod: JSON logs and 10 % of the traces; no sample data.
springProfile: prod
publicUrl: https://api.example.com
corsAllowedOrigins: https://app.example.com

ingress:
  enabled: true
  className: traefik
  host: api.example.com
  clusterIssuer: letsencrypt
  # Network of the cluster's pods (where the Ingress controller comes from). Adjust it to the cluster's CNI.
  trustedProxies: 10[.].*
  trustedProxyHops: 1

networkPolicy:
  enabled: true
  ingressNamespace: traefik
  monitoringNamespace: monitoring

secrets:
  create: false

postgres:
  enabled: false
redis:
  enabled: false
rabbitmq:
  enabled: false

externalDatabase:
  host: showcase.xxxxxxxx.eu-west-1.rds.amazonaws.com
  port: 5432
  jdbcParams: "?sslmode=require"
  # Private network where the managed services are (for the egress NetworkPolicies).
  cidr: 10.0.0.0/16
externalRedis:
  host: showcase.xxxxxx.cache.amazonaws.com
  port: 6379
  ssl: true
  cidr: 10.0.0.0/16
externalRabbitmq:
  host: b-xxxxxxxx.mq.eu-west-1.amazonaws.com
  port: 5671
  vhost: /
  ssl: true
  cidr: 10.0.0.0/16

# Traces to Tempo (k8s/observability) instead of Zipkin.
tracing:
  endpoint: http://tempo.monitoring:9411/api/v2/spans
zipkin:
  enabled: false

# More memory headroom than locally; the CPU limits stay so that the HPA has a stable reference.
defaultResources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Replicas: at least two of each service so that a downed node or an upgrade does not cut the service.
services:
  auth-service:
    replicas: 2
  customer-service:
    replicas: 2
  api-gateway:
    replicas: 2
  product-service:
    autoscaling:
      minReplicas: 3
      maxReplicas: 10
  order-service:
    autoscaling:
      minReplicas: 2
      maxReplicas: 6
