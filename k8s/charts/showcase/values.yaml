# Development values for the local kind cluster. The passwords are the same docker-compose.yml uses
# without .env: they must not be used outside your machine.

image:
  # The images are built with `docker compose build` and loaded into kind with `kind load docker-image`.
  repository: showcase
  tag: latest
  # They are never pulled from a registry: they are already on the nodes.
  pullPolicy: IfNotPresent

# Spring profile: dev loads sample data (admin user) and keeps 100 % of the traces.
springProfile: dev
# Public URL of the gateway: token issuer and origin of the Swagger login. With the Ingress, https://<host>;
# without it (port-forward), http://localhost:8080.
publicUrl: https://showcase.localhost
corsAllowedOrigins: http://localhost:3000

# Entry from outside the cluster: an Ingress (Traefik, k8s/platform) with HTTPS from cert-manager to the gateway.
ingress:
  enabled: true
  className: traefik
  host: showcase.localhost
  clusterIssuer: showcase-ca
  # The gateway only trusts the X-Forwarded-* headers arriving from the pod network (the Ingress
  # controller) and the rate limit uses the client IP added by that single proxy.
  trustedProxies: 10[.]244[.].*
  trustedProxyHops: 1

# NetworkPolicies: everything denied by default; each pod only receives traffic from its callers and only goes out to what
# it needs (its database, RabbitMQ, Redis, the services it calls, DNS and Tempo).
networkPolicy:
  enabled: true
  ingressNamespace: traefik
  monitoringNamespace: monitoring

# Passwords: stored in Kubernetes Secrets. With create: false the chart does not create them and uses those that already exist
# with the same names (each microservice and infra-credentials), for example created by External Secrets.
secrets:
  create: true
  # Only with an external Redis that requires a password.
  redisPassword: ""
  postgresPassword: postgres
  rabbitmqAdminUser: admin
  rabbitmqAdminPassword: admin-dev
  internalClientSecret: internal-dev-secret
  db:
    auth: auth-dev
    product: product-dev
    customer: customer-dev
    order: order-dev
  rabbitmq:
    auth: auth-dev
    product: product-dev
    customer: customer-dev
    order: order-dev
  # JWT RSA keys in PEM (PKCS#8 and X.509). k8s/deploy.sh generates them and they are passed with --set-file.
  jwtPrivateKey: ""
  jwtPublicKey: ""

# Scripts from docker/ reused as they are (k8s/deploy.sh passes them with --set-file).
scripts:
  postgresInit: ""
  rabbitmqSetupUsers: ""

# Default resources of the microservices (JVM with MaxRAMPercentage=75 over the memory limit).
defaultResources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Microservices. port: API port; managementPort: Actuator (health and metrics).
# database/rabbitmq/redis: what each one depends on (environment variables and waiting initContainers).
# discovery: discovers other services with the Kubernetes API (Spring Cloud Kubernetes): it needs read permissions.
# clients: which services call it (NetworkPolicies). autoscaling: HorizontalPodAutoscaler by CPU usage.
services:
  auth-service:
    port: 9000
    replicas: 1
    database: auth
    rabbitmq: auth
    redis: true
    # All validate the JWTs with its public key (/oauth2/jwks).
    clients: [api-gateway, product-service, customer-service, order-service]
  product-service:
    port: 8081
    replicas: 3
    database: product
    rabbitmq: product
    redis: true
    clients: [api-gateway, order-service]
    autoscaling:
      minReplicas: 3
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
  customer-service:
    port: 8082
    replicas: 1
    database: customer
    rabbitmq: customer
    clients: [api-gateway, order-service]
  order-service:
    port: 8083
    replicas: 2
    database: order
    rabbitmq: order
    discovery: true
    clients: [api-gateway]
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
  api-gateway:
    port: 8080
    managementPort: 8081
    replicas: 1
    discovery: true
    redis: true

# Database connections per replica (Hikari; 10 by default). When adding replicas or raising maxReplicas, check
# that replicas x databasePoolSize fits within the database's max_connections.
databasePoolSize: 5

# PostgreSQL, Redis and RabbitMQ inside the cluster (enabled: true) or managed services outside (external*).
postgres:
  enabled: true
  image: postgres:16-alpine
  # With all services at maximum replicas (plus one extra during a rolling update) and databasePoolSize
  # connections each: 16 replicas x 5 = 80, plus headroom for administration connections.
  maxConnections: 200
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

redis:
  enabled: true
  image: redis:7-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

rabbitmq:
  enabled: true
  image: rabbitmq:3-management
  setupImage: curlimages/curl:8.10.1
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# Traces in Zipkin format: to the chart's Zipkin or, with the cluster observability (k8s/observability), to Tempo.
tracing:
  endpoint: http://zipkin:9411/api/v2/spans

# Managed services (when postgres/redis/rabbitmq.enabled is false). cidr: their network, for the NetworkPolicies.
externalDatabase:
  host: ""
  port: 5432
  # Appended to each database's JDBC URL, for example ?sslmode=require
  jdbcParams: ""
  cidr: 0.0.0.0/0
externalRedis:
  host: ""
  port: 6379
  ssl: false
  cidr: 0.0.0.0/0
externalRabbitmq:
  host: ""
  port: 5671
  vhost: /
  ssl: true
  cidr: 0.0.0.0/0

zipkin:
  enabled: true
  image: openzipkin/zipkin:3
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Unprivileged user of the microservice images (adduser -S app in the Dockerfiles).
securityContext:
  runAsUser: 100
  runAsGroup: 101

# Image of the initContainers that wait for PostgreSQL and RabbitMQ.
waitImage: busybox:1.37

# PodMonitors for the Prometheus of kube-prometheus-stack (only if the cluster has its CRDs).
monitoring:
  enabled: true
