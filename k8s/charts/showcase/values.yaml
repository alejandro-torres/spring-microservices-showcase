# Valores de desarrollo para el clúster local de kind. Las contraseñas son las mismas que usa docker-compose.yml
# sin .env: no deben usarse fuera de tu máquina.

image:
  # Las imágenes se construyen con `docker compose build` y se cargan en kind con `kind load docker-image`.
  repository: showcase
  tag: latest
  # Nunca se descargan de un registro: ya están en los nodos.
  pullPolicy: IfNotPresent

# Perfil de Spring: dev carga datos de ejemplo (usuario admin) y guarda el 100 % de las trazas.
springProfile: dev
# URL pública del gateway: emisor de los tokens y origen del login de Swagger. Con el Ingress, https://<host>;
# sin él (port-forward), http://localhost:8080.
publicUrl: https://showcase.localhost
corsAllowedOrigins: http://localhost:3000

# Entrada desde fuera del clúster: un Ingress (Traefik, k8s/platform) con HTTPS de cert-manager hacia el gateway.
ingress:
  enabled: true
  className: traefik
  host: showcase.localhost
  clusterIssuer: showcase-ca
  # El gateway solo se fía de las cabeceras X-Forwarded-* que llegan desde la red de pods (el controlador de
  # Ingress) y el rate limit usa la IP del cliente que añade ese único proxy.
  trustedProxies: 10[.]244[.].*
  trustedProxyHops: 1

# NetworkPolicies: todo denegado por defecto; cada pod solo recibe tráfico de quien lo llama y solo sale hacia lo
# que necesita (su base de datos, RabbitMQ, Redis, los servicios a los que llama, DNS y Tempo).
networkPolicy:
  enabled: true
  ingressNamespace: traefik
  monitoringNamespace: monitoring

# Contraseñas: se guardan en Secrets de Kubernetes. Con create: false el chart no los crea y usa los que ya existan
# con los mismos nombres (cada microservicio y infra-credentials), por ejemplo creados por External Secrets.
secrets:
  create: true
  # Solo con un Redis externo que pida contraseña.
  redisPassword: ""
  postgresPassword: postgres
  rabbitmqAdminUser: admin
  rabbitmqAdminPassword: admin-dev
  internalClientSecret: internal-dev-secret
  db:
    auth: auth-dev
    product: product-dev
    customer: customer-dev
    order: order-dev
  rabbitmq:
    auth: auth-dev
    product: product-dev
    customer: customer-dev
    order: order-dev
  # Claves RSA del JWT en PEM (PKCS#8 y X.509). Las genera k8s/deploy.sh y se pasan con --set-file.
  jwtPrivateKey: ""
  jwtPublicKey: ""

# Scripts de docker/ que se reutilizan tal cual (k8s/deploy.sh los pasa con --set-file).
scripts:
  postgresInit: ""
  rabbitmqSetupUsers: ""

# Recursos por defecto de los microservicios (JVM con MaxRAMPercentage=75 sobre el límite de memoria).
defaultResources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Microservicios. port: puerto de la API; managementPort: Actuator (health y métricas).
# database/rabbitmq/redis: de qué depende cada uno (variables de entorno e initContainers de espera).
# discovery: descubre otros servicios con la API de Kubernetes (Spring Cloud Kubernetes): necesita permisos de lectura.
# clients: qué servicios lo llaman (NetworkPolicies). autoscaling: HorizontalPodAutoscaler por uso de CPU.
services:
  auth-service:
    port: 9000
    replicas: 1
    database: auth
    rabbitmq: auth
    redis: true
    # Todos validan los JWT con su clave pública (/oauth2/jwks).
    clients: [api-gateway, product-service, customer-service, order-service]
  product-service:
    port: 8081
    replicas: 3
    database: product
    rabbitmq: product
    redis: true
    clients: [api-gateway, order-service]
    autoscaling:
      minReplicas: 3
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
  customer-service:
    port: 8082
    replicas: 1
    database: customer
    rabbitmq: customer
    clients: [api-gateway, order-service]
  order-service:
    port: 8083
    replicas: 2
    database: order
    rabbitmq: order
    discovery: true
    clients: [api-gateway]
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
  api-gateway:
    port: 8080
    managementPort: 8081
    replicas: 1
    discovery: true
    redis: true

# Conexiones a la base de datos por réplica (Hikari; 10 por defecto). Al añadir réplicas o subir maxReplicas, revisa
# que réplicas x databasePoolSize quepa en el max_connections de la base de datos.
databasePoolSize: 5

# PostgreSQL, Redis y RabbitMQ dentro del clúster (enabled: true) o servicios gestionados fuera (external*).
postgres:
  enabled: true
  image: postgres:16-alpine
  # Con todos los servicios al máximo de réplicas (más una de más durante un rolling update) y databasePoolSize
  # conexiones cada una: 16 réplicas x 5 = 80, más margen para las conexiones de administración.
  maxConnections: 200
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

redis:
  enabled: true
  image: redis:7-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

rabbitmq:
  enabled: true
  image: rabbitmq:3-management
  setupImage: curlimages/curl:8.10.1
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# Trazas en formato Zipkin: al Zipkin del chart o, con la observabilidad del clúster (k8s/observability), a Tempo.
tracing:
  endpoint: http://zipkin:9411/api/v2/spans

# Servicios gestionados (cuando postgres/redis/rabbitmq.enabled es false). cidr: su red, para las NetworkPolicies.
externalDatabase:
  host: ""
  port: 5432
  # Se añade a la URL JDBC de cada base de datos, por ejemplo ?sslmode=require
  jdbcParams: ""
  cidr: 0.0.0.0/0
externalRedis:
  host: ""
  port: 6379
  ssl: false
  cidr: 0.0.0.0/0
externalRabbitmq:
  host: ""
  port: 5671
  vhost: /
  ssl: true
  cidr: 0.0.0.0/0

zipkin:
  enabled: true
  image: openzipkin/zipkin:3
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Usuario sin privilegios de las imágenes de los microservicios (adduser -S app en los Dockerfile).
securityContext:
  runAsUser: 100
  runAsGroup: 101

# Imagen de los initContainers que esperan a PostgreSQL y RabbitMQ.
waitImage: busybox:1.37

# PodMonitors para el Prometheus de kube-prometheus-stack (solo si el clúster tiene sus CRDs).
monitoring:
  enabled: true
