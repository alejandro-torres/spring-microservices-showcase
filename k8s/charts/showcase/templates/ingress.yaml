{{- if .Values.ingress.enabled }}
# Entry from outside the cluster: https://<host> reaches the gateway, the only exposed service.
# cert-manager issues the TLS certificate with the given ClusterIssuer (locally, the k8s/platform CA).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
    {{- include "showcase.selector" "api-gateway" | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: api-gateway-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
{{- end }}
