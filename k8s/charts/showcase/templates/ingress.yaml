{{- if .Values.ingress.enabled }}
# Entrada desde fuera del clúster: https://<host> llega al gateway, que es el único servicio expuesto.
# cert-manager emite el certificado TLS con el ClusterIssuer indicado (en local, la CA de k8s/platform).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
    {{- include "showcase.selector" "api-gateway" | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: api-gateway-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
{{- end }}
