{{- /*
PodMonitors: Prometheus (kube-prometheus-stack) reads each replica's metrics directly from its pod.
The Docker Compose labels are kept (job="microservices" and eureka_app) to reuse the dashboards
and alerts from docker/.
*/ -}}
{{- if and .Values.monitoring.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "showcase.selector" $name | nindent 6 }}
  podMetricsEndpoints:
    # The Actuator port: the gateway uses an internal one different from the public one.
    - port: {{ if and $svc.managementPort (ne $svc.managementPort $svc.port) }}management{{ else }}http{{ end }}
      path: /actuator/prometheus
      interval: 10s
      # The metrics already carry the tags application, instance (that of X-Instance-Id) and environment.
      honorLabels: true
      relabelings:
        - targetLabel: job
          replacement: microservices
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: eureka_app
          action: uppercase
{{- end }}
{{- if .Values.rabbitmq.enabled }}
---
# RabbitMQ: messages per queue (DLQs too) and consumers, with RabbitMQ's Prometheus plugin.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rabbitmq
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
    {{- include "showcase.selector" "rabbitmq" | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "showcase.selector" "rabbitmq" | nindent 6 }}
  podMetricsEndpoints:
    - port: prometheus
      path: /metrics/detailed
      params:
        family: [queue_coarse_metrics, queue_consumer_count]
      interval: 10s
      relabelings:
        - targetLabel: job
          replacement: rabbitmq
{{- end }}
{{- end }}
