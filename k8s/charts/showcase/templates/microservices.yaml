{{- /*
One Deployment, Service, ConfigMap and Secret per microservice, generated from .Values.services.
*/ -}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- $managementPort := $svc.managementPort | default $svc.port }}
{{- $config := include "showcase.serviceConfig" (dict "root" $root "name" $name "svc" $svc) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
data:
  {{- $config | nindent 2 }}
{{- if $root.Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
type: Opaque
stringData:
  {{- with $svc.database }}
  DB_PASSWORD: {{ index $root.Values.secrets.db . | quote }}
  {{- end }}
  {{- with $svc.rabbitmq }}
  RABBITMQ_PASSWORD: {{ index $root.Values.secrets.rabbitmq . | quote }}
  {{- end }}
  {{- if eq $name "auth-service" }}
  INTERNAL_CLIENT_SECRET: {{ $root.Values.secrets.internalClientSecret | quote }}
  # Shared RSA key: tokens stay valid even if auth-service restarts or scales.
  JWT_PRIVATE_KEY: {{ required "Missing secrets.jwtPrivateKey (use k8s/deploy.sh or --set-file)" $root.Values.secrets.jwtPrivateKey | quote }}
  JWT_PUBLIC_KEY: {{ required "Missing secrets.jwtPublicKey (use k8s/deploy.sh or --set-file)" $root.Values.secrets.jwtPublicKey | quote }}
  {{- end }}
  {{- if and $svc.redis $root.Values.secrets.redisPassword }}
  SPRING_DATA_REDIS_PASSWORD: {{ $root.Values.secrets.redisPassword | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
spec:
  selector:
    {{- include "showcase.selector" $name | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
    {{- if ne $managementPort $svc.port }}
    - name: management
      port: {{ $managementPort }}
      targetPort: management
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
spec:
  {{- if not $svc.autoscaling }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  # Zero-downtime update: a new replica starts first and only when it is ready is an old one stopped.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "showcase.selector" $name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "showcase.labels" $root | nindent 8 }}
        {{- include "showcase.selector" $name | nindent 8 }}
      annotations:
        # If the configuration or secrets change, the pods are recreated on helm upgrade.
        checksum/config: {{ $config | sha256sum }}
        checksum/secrets: {{ toJson $root.Values.secrets | sha256sum }}
    spec:
      # Without the REDIS_PORT=tcp://... variables Kubernetes creates per Service: they clash with Spring's.
      enableServiceLinks: false
      securityContext:
        {{- include "showcase.podSecurityContext" (dict "user" $root.Values.securityContext.runAsUser "group" $root.Values.securityContext.runAsGroup) | nindent 8 }}
      # Spring finishes in-flight requests (shutdown: graceful, up to 30 s) before the stop is forced.
      terminationGracePeriodSeconds: 45
      {{- if $svc.discovery }}
      # Permission to read Services and endpoints (Spring Cloud Kubernetes); the others do not need the API.
      serviceAccountName: service-discovery
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- if or $svc.database $svc.rabbitmq }}
      initContainers:
        {{- if $svc.database }}
        {{- include "showcase.waitFor" (dict "root" $root "args" (list (include "showcase.postgresHost" $root) (include "showcase.postgresPort" $root))) | nindent 8 }}
        {{- end }}
        {{- if $svc.rabbitmq }}
        {{- include "showcase.waitFor" (dict "root" $root "args" (list (include "showcase.rabbitmqHost" $root) (include "showcase.rabbitmqPort" $root))) | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.repository }}/{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- include "showcase.containerSecurityContext" $root | nindent 12 }}
          # A few seconds for the Service and load balancers to stop sending traffic to the replica before stopping it.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            {{- if ne $managementPort $svc.port }}
            - name: management
              containerPort: {{ $managementPort }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
            - secretRef:
                name: {{ $name }}
          # The JVM's first startup is slow: up to 3 minutes before the other probes begin.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ $managementPort }}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ $managementPort }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ $managementPort }}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml ($svc.resources | default $root.Values.defaultResources) | nindent 12 }}
          # The only writable thing: Tomcat's and the JVM's temporary files.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if $svc.autoscaling }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # Scales down slowly (one replica per minute, after 5 stable minutes) so as not to oscillate with short spikes.
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
{{- if or $svc.autoscaling (gt (int $svc.replicas) 1) }}
---
# During a node drain or a cluster upgrade, at most one replica out at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "showcase.selector" $name | nindent 6 }}
{{- end }}
{{- end }}
