{{- /*
Un Deployment, Service, ConfigMap y Secret por microservicio, generados a partir de .Values.services.
*/ -}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- $managementPort := $svc.managementPort | default $svc.port }}
{{- $config := include "showcase.serviceConfig" (dict "root" $root "name" $name "svc" $svc) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
data:
  {{- $config | nindent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
type: Opaque
stringData:
  {{- with $svc.database }}
  DB_PASSWORD: {{ index $root.Values.secrets.db . | quote }}
  {{- end }}
  {{- with $svc.rabbitmq }}
  RABBITMQ_PASSWORD: {{ index $root.Values.secrets.rabbitmq . | quote }}
  {{- end }}
  {{- if eq $name "auth-service" }}
  INTERNAL_CLIENT_SECRET: {{ $root.Values.secrets.internalClientSecret | quote }}
  # Clave RSA compartida: los tokens siguen siendo válidos aunque se reinicie o escale auth-service.
  JWT_PRIVATE_KEY: {{ required "Falta secrets.jwtPrivateKey (usa k8s/deploy.sh o --set-file)" $root.Values.secrets.jwtPrivateKey | quote }}
  JWT_PUBLIC_KEY: {{ required "Falta secrets.jwtPublicKey (usa k8s/deploy.sh o --set-file)" $root.Values.secrets.jwtPublicKey | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
spec:
  selector:
    {{- include "showcase.selector" $name | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
    {{- if ne $managementPort $svc.port }}
    - name: management
      port: {{ $managementPort }}
      targetPort: management
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
spec:
  {{- if not $svc.autoscaling }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  # Actualización sin cortes: primero arranca una réplica nueva y solo cuando está lista se para una antigua.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "showcase.selector" $name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "showcase.labels" $root | nindent 8 }}
        {{- include "showcase.selector" $name | nindent 8 }}
      annotations:
        # Si cambian la configuración o los secretos, los pods se vuelven a crear al hacer helm upgrade.
        checksum/config: {{ $config | sha256sum }}
        checksum/secrets: {{ toJson $root.Values.secrets | sha256sum }}
    spec:
      # Sin las variables REDIS_PORT=tcp://... que Kubernetes crea por cada Service: chocan con las de Spring.
      enableServiceLinks: false
      securityContext:
        {{- include "showcase.podSecurityContext" (dict "user" $root.Values.securityContext.runAsUser "group" $root.Values.securityContext.runAsGroup) | nindent 8 }}
      # Spring termina las peticiones en curso (shutdown: graceful, hasta 30 s) antes de que se fuerce la parada.
      terminationGracePeriodSeconds: 45
      {{- if $svc.discovery }}
      # Permiso para leer Services y endpoints (Spring Cloud Kubernetes); los demás no necesitan la API.
      serviceAccountName: service-discovery
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- if or $svc.database $svc.rabbitmq }}
      initContainers:
        {{- if $svc.database }}
        {{- include "showcase.waitFor" (dict "root" $root "args" (list "postgres" 5432)) | nindent 8 }}
        {{- end }}
        {{- if $svc.rabbitmq }}
        {{- include "showcase.waitFor" (dict "root" $root "args" (list "rabbitmq" 5672)) | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.repository }}/{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- include "showcase.containerSecurityContext" $root | nindent 12 }}
          # Unos segundos para que el Service y los balanceadores dejen de enviar tráfico a la réplica antes de pararla.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            {{- if ne $managementPort $svc.port }}
            - name: management
              containerPort: {{ $managementPort }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
            - secretRef:
                name: {{ $name }}
          # El primer arranque de la JVM es lento: hasta 3 minutos antes de que empiecen las demás sondas.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ $managementPort }}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ $managementPort }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ $managementPort }}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml ($svc.resources | default $root.Values.defaultResources) | nindent 12 }}
          # Lo único escribible: los temporales de Tomcat y de la JVM.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if $svc.autoscaling }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # Baja despacio (una réplica por minuto, tras 5 minutos estable) para no oscilar con picos cortos.
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
{{- if or $svc.autoscaling (gt (int $svc.replicas) 1) }}
---
# Durante un drenado de nodo o una actualización del clúster, como mucho una réplica fuera a la vez.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "showcase.labels" $root | nindent 4 }}
    {{- include "showcase.selector" $name | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "showcase.selector" $name | nindent 6 }}
{{- end }}
{{- end }}
