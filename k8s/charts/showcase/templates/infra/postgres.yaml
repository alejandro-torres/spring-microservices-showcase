{{- if .Values.postgres.enabled }}
# PostgreSQL with one database and one user per service (docker/postgres/init-databases.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
data:
  init-databases.sh: |
    {{- required "Missing scripts.postgresInit (use k8s/deploy.sh or --set-file)" .Values.scripts.postgresInit | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
    {{- include "showcase.selector" "postgres" | nindent 4 }}
spec:
  selector:
    {{- include "showcase.selector" "postgres" | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
    {{- include "showcase.selector" "postgres" | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "showcase.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "showcase.labels" . | nindent 8 }}
        {{- include "showcase.selector" "postgres" | nindent 8 }}
    spec:
      # postgres user of the alpine image (uid 70) instead of root.
      securityContext:
        {{- include "showcase.podSecurityContext" (dict "user" 70 "group" 70) | nindent 8 }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "max_connections={{ .Values.postgres.maxConnections }}"]
          securityContext:
            {{- include "showcase.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            # Subfolder: the volume root may contain files that prevent initializing the database.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: infra-credentials
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # The only writable things besides the data: the socket and temporary files.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
