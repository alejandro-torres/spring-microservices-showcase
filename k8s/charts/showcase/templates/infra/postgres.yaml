# PostgreSQL con una base de datos y un usuario por servicio (docker/postgres/init-databases.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
data:
  init-databases.sh: |
    {{- required "Falta scripts.postgresInit (usa k8s/deploy.sh o --set-file)" .Values.scripts.postgresInit | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
    {{- include "showcase.selector" "postgres" | nindent 4 }}
spec:
  selector:
    {{- include "showcase.selector" "postgres" | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
    {{- include "showcase.selector" "postgres" | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "showcase.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "showcase.labels" . | nindent 8 }}
        {{- include "showcase.selector" "postgres" | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            # Subcarpeta: la raíz del volumen puede traer ficheros que impiden inicializar la base de datos.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: infra-credentials
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
