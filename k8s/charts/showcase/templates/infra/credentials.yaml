{{- if .Values.secrets.create }}
# Infrastructure credentials: PostgreSQL superuser, RabbitMQ administrator and the passwords
# of each service used by the initialization scripts.
apiVersion: v1
kind: Secret
metadata:
  name: infra-credentials
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  RABBITMQ_ADMIN_USER: {{ .Values.secrets.rabbitmqAdminUser | quote }}
  RABBITMQ_ADMIN_PASSWORD: {{ .Values.secrets.rabbitmqAdminPassword | quote }}
  {{- range $service, $password := .Values.secrets.db }}
  {{ upper $service }}_DB_PASSWORD: {{ $password | quote }}
  {{- end }}
  {{- range $service, $password := .Values.secrets.rabbitmq }}
  {{ upper $service }}_RABBITMQ_PASSWORD: {{ $password | quote }}
  {{- end }}
{{- end }}
