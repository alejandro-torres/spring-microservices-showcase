{{- if .Values.zipkin.enabled }}
# Zipkin en memoria para las trazas (en la fase de observabilidad se sustituye por Tempo).
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
    {{- include "showcase.selector" "zipkin" | nindent 4 }}
spec:
  selector:
    {{- include "showcase.selector" "zipkin" | nindent 4 }}
  ports:
    - name: http
      port: 9411
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
    {{- include "showcase.selector" "zipkin" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "showcase.selector" "zipkin" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "showcase.labels" . | nindent 8 }}
        {{- include "showcase.selector" "zipkin" | nindent 8 }}
    spec:
      containers:
        - name: zipkin
          image: {{ .Values.zipkin.image }}
          ports:
            - name: http
              containerPort: 9411
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.zipkin.resources | nindent 12 }}
{{- end }}
