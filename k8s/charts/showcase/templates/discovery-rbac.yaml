# Service discovery without Eureka: the gateway and order-service (Spring Cloud Kubernetes) read from the
# Kubernetes API the Services and their endpoints (the IPs of the ready replicas) of this namespace. Read-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-discovery
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: service-discovery
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: service-discovery
  labels:
    {{- include "showcase.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: service-discovery
subjects:
  - kind: ServiceAccount
    name: service-discovery
    namespace: {{ .Release.Namespace }}
