# Clúster local de kind: 1 control-plane + 2 workers. Cada nodo es un contenedor de Docker.
# Los puertos 80 y 443 del host llegan al control-plane, donde irá el Ingress (fase 4).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: showcase
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
