# Grafana Alloy as a DaemonSet: one pod per node reads the log files of that node's pods and sends them to Loki.
controller:
  type: daemonset

alloy:
  mounts:
    # The node's /var/log, where the kubelet leaves each container's logs.
    varlog: true
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
  configMap:
    content: |
      // Pods of the node this Alloy replica runs on, only from the application's namespace.
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["showcase"]
        }
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // The same labels as in Docker Compose: service (the microservice) and container (the specific replica).
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.json.receiver]
      }

      // Log format of the container runtime (CRI) and, inside, the microservices' JSON (ECS): the level
      // as a label and the traceId, spanId and replica as metadata, just as in Docker Compose.
      loki.process "json" {
        stage.cri {}
        stage.json {
          expressions = {
            level    = "log.level",
            traceId  = "traceId",
            spanId   = "spanId",
            instance = "service.node.name",
          }
        }
        stage.labels {
          values = { level = "" }
        }
        stage.structured_metadata {
          values = { traceId = "", spanId = "", instance = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }
