# Grafana Alloy como DaemonSet: un pod por nodo lee los ficheros de log de los pods de ese nodo y los envía a Loki.
controller:
  type: daemonset

alloy:
  mounts:
    # /var/log del nodo, donde el kubelet deja los logs de cada contenedor.
    varlog: true
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
  configMap:
    content: |
      // Pods del nodo en el que corre esta réplica de Alloy, solo del namespace de la aplicación.
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["showcase"]
        }
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Las mismas etiquetas que en Docker Compose: service (el microservicio) y container (la réplica concreta).
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.json.receiver]
      }

      // Formato de log del runtime de contenedores (CRI) y, dentro, el JSON (ECS) de los microservicios: el nivel
      // como etiqueta y el traceId, el spanId y la réplica como metadatos, igual que en Docker Compose.
      loki.process "json" {
        stage.cri {}
        stage.json {
          expressions = {
            level    = "log.level",
            traceId  = "traceId",
            spanId   = "spanId",
            instance = "service.node.name",
          }
        }
        stage.labels {
          values = { level = "" }
        }
        stage.structured_metadata {
          values = { traceId = "", spanId = "", instance = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }
