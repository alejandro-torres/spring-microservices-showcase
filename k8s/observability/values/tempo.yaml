# Tempo in a single process, with traces on disk. It receives spans in Zipkin format (port 9411), so the
# microservices do not change: only the ZIPKIN_ENDPOINT URL does.
tempo:
  retention: 168h
  receivers:
    zipkin:
      endpoint: 0.0.0.0:9411
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

persistence:
  enabled: true
  size: 5Gi
