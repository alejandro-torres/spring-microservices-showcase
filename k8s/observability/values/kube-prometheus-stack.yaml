# kube-prometheus-stack: Prometheus (with its operator), Alertmanager, Grafana, kube-state-metrics and node-exporter.

# In kind, etcd, the scheduler, the controller-manager and kube-proxy only listen on localhost: Prometheus cannot
# read them and their alerts would always fire.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    # Stores the exemplars (traceId of specific requests) to jump from a chart to its trace in Tempo.
    enableFeatures:
      - exemplar-storage
    # Reads all the cluster's PodMonitors and PrometheusRules, not only those of this release.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 128Mi }

# In Docker Desktop the node's root is not a shared mount and node-exporter does not start if it mounts it.
prometheus-node-exporter:
  hostRootFsMount:
    enabled: false

grafana:
  # Only for the local cluster: the same password as Docker Compose without .env.
  adminUser: admin
  adminPassword: admin
  persistence:
    enabled: true
    size: 1Gi
  grafana.ini:
    users:
      default_language: en-US
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/Showcase/01-overview.json
  sidecar:
    dashboards:
      # ConfigMaps with the grafana_dashboard=1 label (install.sh creates them from docker/grafana/dashboards).
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      # Prometheus datasource the chart creates: each exemplar in the latency charts opens its trace.
      uid: prometheus
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
  # The same datasources as in Docker Compose, linked by the traceId, with Tempo instead of Zipkin.
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      jsonData:
        derivedFields:
          - name: traceId
            matcherType: regex
            matcherRegex: '"traceId":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
            urlDisplayLabel: View the trace in Tempo
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          customQuery: true
          query: '{service=~".+"} | traceId="$${__trace.traceId}"'
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
