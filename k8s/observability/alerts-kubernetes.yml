# Kubernetes alerts for the application's pods (showcase namespace). They add to those of
# docker/prometheus/alerts.yml; install.sh loads them as a PrometheusRule.
groups:
  - name: showcase-kubernetes
    rules:
      - alert: PodEnCrashLoop
        expr: max by (pod, container) (kube_pod_container_status_waiting_reason{namespace="showcase", reason="CrashLoopBackOff"}) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container }} of pod {{ $labels.pod }} keeps restarting"
          description: "It is in CrashLoopBackOff: check kubectl -n showcase logs {{ $labels.pod }} --previous."

      - alert: PodNoListo
        expr: |
          max by (pod) (kube_pod_status_ready{namespace="showcase", condition="false"})
            * on (pod) group_left max by (pod) (kube_pod_status_phase{namespace="showcase", phase=~"Running|Pending|Unknown"})
            > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} is not ready"
          description: "It has been failing the readiness probe for 5 minutes: it receives no traffic. Check kubectl -n showcase describe pod {{ $labels.pod }}."

      - alert: DeploymentSinTodasLasReplicas
        expr: |
          kube_deployment_spec_replicas{namespace="showcase"}
            > kube_deployment_status_replicas_available{namespace="showcase"}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.deployment }} does not have all its replicas available"
          description: "Replicas have been missing for 10 minutes (pods unscheduled, not started or not ready)."
