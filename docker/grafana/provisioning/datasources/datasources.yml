# Datasources provisioned when Grafana starts, linked to each other by the traceId:
#   - Prometheus → Zipkin: each exemplar in the latency charts opens its trace.
#   - Loki → Zipkin: the traceId of each log line opens its trace.
#   - Zipkin → Loki: from a trace you can see the logs of that request.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: zipkin

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: traceId
          matcherType: regex
          matcherRegex: '"traceId":"(\w+)"'
          url: "$${__value.raw}"
          datasourceUid: zipkin
          urlDisplayLabel: View the trace in Zipkin

  - name: Zipkin
    uid: zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{service=~".+"} | traceId="$${__trace.traceId}"'
