# Prometheus: discovers all the replicas in Eureka (without listing instances by hand) and reads their metrics.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Microservices: each replica registered in Eureka publishes in the prometheus-port metadata the port of its
  # actuator (the gateway uses an internal one different from the public one).
  - job_name: microservices
    metrics_path: /actuator/prometheus
    # The metrics already carry the tags application, instance (that of X-Instance-Id) and environment.
    honor_labels: true
    eureka_sd_configs:
      - server: http://discovery-service:8761/eureka
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_eureka_app_instance_ip_addr, __meta_eureka_app_instance_metadata_prometheus_port]
        separator: ":"
        target_label: __address__
      - source_labels: [__meta_eureka_app_name]
        target_label: eureka_app

  # Eureka does not register with itself: it is read by its name on the Docker network.
  - job_name: discovery-service
    metrics_path: /actuator/prometheus
    honor_labels: true
    static_configs:
      - targets: ["discovery-service:8761"]

  # RabbitMQ: messages per queue (DLQs too) and consumers, with RabbitMQ's Prometheus plugin.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
