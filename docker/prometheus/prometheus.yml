# Prometheus: descubre todas las réplicas en Eureka (sin listar instancias a mano) y lee sus métricas.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Microservicios: cada réplica registrada en Eureka publica en el metadato prometheus-port el puerto de su
  # actuator (el gateway usa uno interno distinto del público).
  - job_name: microservices
    metrics_path: /actuator/prometheus
    # Las métricas ya traen las etiquetas application, instance (la de X-Instance-Id) y environment.
    honor_labels: true
    eureka_sd_configs:
      - server: http://discovery-service:8761/eureka
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_eureka_app_instance_ip_addr, __meta_eureka_app_instance_metadata_prometheus_port]
        separator: ":"
        target_label: __address__
      - source_labels: [__meta_eureka_app_name]
        target_label: eureka_app

  # Eureka no se registra en sí mismo: se lee por su nombre en la red de Docker.
  - job_name: discovery-service
    metrics_path: /actuator/prometheus
    honor_labels: true
    static_configs:
      - targets: ["discovery-service:8761"]

  # RabbitMQ: mensajes por cola (también las DLQ) y consumidores, con el plugin de Prometheus de RabbitMQ.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
