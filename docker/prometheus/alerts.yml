# Sample alerts. They are visible in Prometheus (http://localhost:9090/alerts) and in Grafana (Alerting → Alert rules,
# datasource Prometheus).
groups:
  - name: showcase
    rules:
      - alert: TasaDeErrores5xxAlta
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5 % of 5xx errors in {{ $labels.application }}"
          description: "For 5 minutes, {{ $value | humanizePercentage }} of the responses are 5xx."

      - alert: LatenciaP95Alta
        expr: |
          histogram_quantile(0.95,
            sum by (application, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1 s in {{ $labels.application }}"
          description: "The 95th percentile is {{ $value | humanizeDuration }}."

      - alert: MensajesEnDLQ
        expr: sum by (queue) (rabbitmq_detailed_queue_messages{queue=~".*[.]dlq"}) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "There are messages in DLQ {{ $labels.queue }}"
          description: "{{ $value }} failed messages await review (GET /api/v1/admin/{service}/dead-letters)."

      - alert: CircuitBreakerAbierto
        expr: max by (application, name) (resilience4j_circuitbreaker_state{state="open"}) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker {{ $labels.name }} open in {{ $labels.application }}"
          description: "Calls to {{ $labels.name }} are being cut off with 503."

      - alert: ReplicaCaida
        expr: up{job="microservices"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Replica {{ $labels.instance }} is not responding"
          description: "Prometheus has not been able to read its metrics for 1 minute."

      - alert: EventosAtascadosEnOutbox
        expr: max by (application) (outbox_events{status="pending"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} cannot publish its events"
          description: "{{ $value }} pending events in the outbox: check the connection to RabbitMQ."
