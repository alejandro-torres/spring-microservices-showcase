server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  # Honors the gateway's X-Forwarded-* headers (Swagger URLs, Location of 201s...).
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: order-service
  messages:
    # messages.properties is in English; without this a server in another language would use its locale as a fallback.
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:order}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth-service's public key to validate JWTs (downloaded and cached).
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  cloud:
    loadbalancer:
      # Replica list cached for only 5 s: a downed replica stops receiving Feign calls right away.
      cache:
        ttl: 5s
    openfeign:
      client:
        config:
          default:
            # Fail fast: the user waits for the response while the other services are queried.
            connect-timeout: 2000
            read-timeout: 3000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # guest/guest only works locally; in docker-compose each service has its own user.
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # The outbox only considers an event sent if RabbitMQ confirms it has received it (confirm) and that it had
    # a destination queue (return with mandatory).
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        # Automatic ACK when the listener ends without an exception (after the service's commit).
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 1
        max-concurrency: 4
        # A rejected message does not return to the queue: it goes to its DLQ.
        default-requeue-rejected: false
        observation-enabled: true
        retry:
          enabled: true
          # 1 attempt + 3 retries waiting 1 s, 2 s and 4 s; then, to the DLQ.
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s
  lifecycle:
    timeout-per-shutdown-phase: 30s

showcase:
  messaging:
    # Processed events are kept for 7 days (to discard duplicates); a nightly task then deletes them.
    processed-event-retention: 7d
    source: ${spring.application.name}
    exchange: order.events
    consumers:
      stock-reserved:
        queue: order-service.stock-reserved
        exchange: product.events
        routing-key: stock.reserved
      stock-reservation-failed:
        queue: order-service.stock-reservation-failed
        exchange: product.events
        routing-key: stock.reservation-failed
  # Without a URL, Feign looks up the replicas in Eureka and distributes the calls with Spring Cloud LoadBalancer. A fixed URL
  # (PRODUCT_SERVICE_URL...) skips Eureka: for testing only.
  clients:
    product-service:
      url: ${PRODUCT_SERVICE_URL:}
    customer-service:
      url: ${CUSTOMER_SERVICE_URL:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Replica list refreshed every 5 s (30 s by default).
    registry-fetch-interval-seconds: 5
  instance:
    # Unique id of each replica, computed once at startup (common-lib); it is the same as the
    # X-Instance-Id header of the responses.
    instance-id: ${showcase.instance-id}
    prefer-ip-address: true
    # Heartbeat every 5 s; if missing for 15 s, Eureka removes the replica.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    # Prometheus discovers the replicas in Eureka and reads here which port their metrics are on.
    metadata-map:
      prometheus-port: ${management.server.port:${server.port}}

# Each SQL query is a span in Zipkin (without the parameter values, which may be personal data).
jdbc:
  includes: connection, query
  datasource-proxy:
    include-parameter-values: false

management:
  metrics:
    # Common tags of all metrics: service, replica (the same as X-Instance-Id) and environment.
    tags:
      application: ${spring.application.name}
      instance: ${showcase.instance-id}
      environment: ${ENVIRONMENT:dev}
    distribution:
      # Latency histogram to compute p50/p95/p99 in Prometheus; with traces, each bucket carries an
      # exemplar with the traceId of a real request (to jump from the chart to Zipkin).
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    annotations:
      # Custom spans with @Observed in the key use cases (visible in Zipkin within the request).
      enabled: true
  tracing:
    sampling:
      # 10 % by default (prod); the dev profile samples 100 %.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Structured logs (when enabled with logging.structured.format.console=ecs, as in Docker and prod):
# each line is a JSON with the service, the replica, the environment and the request's traceId/spanId.
logging:
  structured:
    ecs:
      service:
        node-name: ${showcase.instance-id}
        environment: ${ENVIRONMENT:dev}

---
# In Kubernetes there is no Eureka: Spring Cloud Kubernetes reads the ready replicas of each Service with the
# Kubernetes API and Spring Cloud LoadBalancer distributes the calls just as with Eureka.
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
  cloud:
    kubernetes:
      discovery:
        # If a Service publishes several ports, the API one is used.
        primary-port-name: http
eureka:
  client:
    enabled: false
