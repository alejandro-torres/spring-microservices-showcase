# order-service error messages in English.
error.ORDER_NOT_FOUND=No active order with id {0} was found.
error.CUSTOMER_NOT_FOUND=No active customer with id {0} was found.
error.PRODUCT_NOT_FOUND=No active product with id {0} was found.
error.INVALID_ORDER_DATA=The order data is not valid (field ''{0}'').
error.DUPLICATE_ORDER_LINE=Product {0} appears in more than one order line.
error.CUSTOMER_WITHOUT_ADDRESS=Customer {0} has no shipping address.
error.INSUFFICIENT_STOCK=Not enough stock of product {0} ({1} units left).
error.INVALID_STATUS_TRANSITION=An order in status {0} cannot change to {1}.
error.ORDER_NOT_MODIFIABLE=Order {0} is {1} and can no longer be modified.
error.ORDER_NOT_CANCELLABLE=Order {0} is {1}: only confirmed orders can be cancelled (a pending one is still reserving stock).
error.ORDER_NOT_DELETABLE=Order {0} is {1}: only cancelled or rejected orders can be deleted.
