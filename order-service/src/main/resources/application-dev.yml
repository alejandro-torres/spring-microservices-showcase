# Perfil de desarrollo: añade pedidos de ejemplo para probar la paginación y los filtros.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data
    # Los datos de ejemplo son V1000: sin esto, una migración nueva del esquema (V5, V6...) se rechazaría en una
    # base de desarrollo que ya los tiene.
    out-of-order: true

logging:
  level:
    com.showcase: DEBUG

management:
  tracing:
    sampling:
      # En desarrollo se guardan todas las trazas.
      probability: 1.0
