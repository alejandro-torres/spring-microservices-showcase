# Mensajes de error de order-service (español, idioma por defecto).
error.ORDER_NOT_FOUND=No existe ningún pedido activo con id {0}.
error.CUSTOMER_NOT_FOUND=No existe ningún cliente activo con id {0}.
error.PRODUCT_NOT_FOUND=No existe ningún producto activo con id {0}.
error.INVALID_ORDER_DATA=Los datos del pedido no son válidos (campo ''{0}'').
error.DUPLICATE_ORDER_LINE=El producto {0} aparece en más de una línea del pedido.
error.CUSTOMER_WITHOUT_ADDRESS=El cliente {0} no tiene ninguna dirección de envío.
error.INSUFFICIENT_STOCK=No hay stock suficiente del producto {0} (quedan {1} unidades).
error.INVALID_STATUS_TRANSITION=Un pedido en estado {0} no puede pasar a {1}.
error.ORDER_NOT_MODIFIABLE=El pedido {0} está en estado {1} y ya no se puede modificar.
error.ORDER_NOT_DELETABLE=El pedido {0} está en estado {1}: solo se borran pedidos cancelados o rechazados.
