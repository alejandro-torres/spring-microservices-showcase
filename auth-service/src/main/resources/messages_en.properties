# auth-service error messages in English.
error.USER_NOT_FOUND=No active user with id {0} was found.
error.ROLE_NOT_FOUND=No active role with id {0} was found.
error.PERMISSION_NOT_FOUND=No active permission with id {0} was found.
error.USERNAME_ALREADY_EXISTS=Username ''{0}'' is already taken.
error.EMAIL_ALREADY_EXISTS=Email ''{0}'' is already registered.
error.ROLE_ALREADY_EXISTS=Role ''{0}'' already exists.
error.PERMISSION_ALREADY_EXISTS=Permission ''{0}'' already exists.
error.ROLE_IN_USE=Role ''{0}'' is assigned to {1} active users and cannot be deleted.
error.PERMISSION_IN_USE=Permission ''{0}'' is included in {1} active roles and cannot be deleted.
error.ROLE_ALREADY_ASSIGNED=User ''{1}'' already has role ''{0}''.
error.ROLE_NOT_ASSIGNED=User ''{1}'' does not have the role with id {0}.
error.INVALID_USERNAME=Username ''{0}'' is not valid: use 3 to 30 letters, digits, dots, hyphens or underscores.
error.INVALID_EMAIL=Email ''{0}'' is not valid.
error.INVALID_ROLE_NAME=Role name ''{0}'' is not valid: use 2 to 30 letters or underscores, starting with a letter.
error.INVALID_PERMISSION_NAME=Permission ''{0}'' is not valid: use the resource:action format, for example product:write.
error.ACCOUNT_LOCKED=The account ''{0}'' is locked until {1} after too many failed sign-in attempts.
error.INVALID_CURRENT_PASSWORD=The current password is incorrect.
error.PASSWORD_RECENTLY_USED=The new password cannot be any of your last {0} passwords.

# Password validation (@StrongPassword)
StrongPassword=must be 8 to 72 characters long, without spaces, and include uppercase, lowercase, digits and symbols
