# Development profile: adds sample data (users, roles and permissions) to try pagination and filters.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data
    # The sample data is V1000: without this, a new schema migration (V3, V6...) would be rejected on a
    # development database that already has it.
    out-of-order: true
  jpa:
    show-sql: false

# Secret of the internal-service client for development only (in other environments it goes in the INTERNAL_CLIENT_SECRET variable).
INTERNAL_CLIENT_SECRET: internal-dev-secret

logging:
  level:
    com.showcase: DEBUG

management:
  tracing:
    sampling:
      # In development all traces are kept.
      probability: 1.0
