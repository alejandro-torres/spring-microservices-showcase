# Perfil de desarrollo: añade datos de ejemplo (usuarios, roles y permisos) para probar la paginación y los filtros.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data
  jpa:
    show-sql: false

# Secreto del cliente internal-service solo para desarrollo (en otros entornos va en la variable INTERNAL_CLIENT_SECRET).
INTERNAL_CLIENT_SECRET: internal-dev-secret

logging:
  level:
    com.showcase: DEBUG
