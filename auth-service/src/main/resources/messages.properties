# Mensajes de error de auth-service. Este fichero base está en español (idioma por defecto).
# Formato MessageFormat: las comillas simples se escriben dobles ('').
error.USER_NOT_FOUND=No existe ningún usuario activo con id {0}.
error.ROLE_NOT_FOUND=No existe ningún rol activo con id {0}.
error.PERMISSION_NOT_FOUND=No existe ningún permiso activo con id {0}.
error.USERNAME_ALREADY_EXISTS=El nombre de usuario ''{0}'' ya está en uso.
error.EMAIL_ALREADY_EXISTS=El email ''{0}'' ya está registrado.
error.ROLE_ALREADY_EXISTS=Ya existe el rol ''{0}''.
error.PERMISSION_ALREADY_EXISTS=Ya existe el permiso ''{0}''.
error.ROLE_IN_USE=El rol ''{0}'' está asignado a {1} usuarios activos y no se puede borrar.
error.PERMISSION_IN_USE=El permiso ''{0}'' está incluido en {1} roles activos y no se puede borrar.
error.ROLE_ALREADY_ASSIGNED=El usuario ''{1}'' ya tiene el rol ''{0}''.
error.ROLE_NOT_ASSIGNED=El usuario ''{1}'' no tiene asignado el rol con id {0}.
error.INVALID_USERNAME=El nombre de usuario ''{0}'' no es válido: usa de 3 a 30 caracteres entre letras, números, punto, guion o guion bajo.
error.INVALID_EMAIL=El email ''{0}'' no es válido.
error.INVALID_ROLE_NAME=El nombre de rol ''{0}'' no es válido: usa de 2 a 30 letras o guiones bajos, empezando por una letra.
error.INVALID_PERMISSION_NAME=El permiso ''{0}'' no es válido: usa el formato recurso:accion, por ejemplo product:write.
error.ACCOUNT_LOCKED=La cuenta de ''{0}'' está bloqueada hasta {1} por demasiados intentos de inicio de sesión fallidos.
