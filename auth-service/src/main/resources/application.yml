server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: auth-service
  messages:
    # messages.properties está en español; sin esto un servidor en otro idioma usaría su locale como respaldo.
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Carga las colecciones (roles, permisos) en lotes para evitar el problema N+1 al paginar
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
