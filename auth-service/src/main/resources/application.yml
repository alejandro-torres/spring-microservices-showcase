server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: auth-service
  messages:
    # messages.properties está en español; sin esto un servidor en otro idioma usaría su locale como respaldo.
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Carga las colecciones (roles, permisos) en lotes para evitar el problema N+1 al paginar
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # guest/guest solo sirve en local; en docker-compose cada servicio tiene su propio usuario.
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # El outbox solo da un evento por enviado si RabbitMQ confirma que lo ha recibido (confirm) y que tenía
    # una cola de destino (return con mandatory).
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

showcase:
  messaging:
    source: ${spring.application.name}
    # auth-service solo publica: no consume ninguna cola.
    exchange: auth.events
  security:
    issuer: ${AUTH_ISSUER:http://localhost:9000}
    access-token-ttl: 15m
    refresh-token-ttl: 8h
    jwt:
      # Claves RSA en PEM (PKCS#8 y X.509). Obligatorias con varias réplicas; sin ellas se genera un par en memoria.
      key-id: ${JWT_KEY_ID:showcase-key}
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
    clients:
      # Frontend de navegador: authorization_code con PKCE, sin secreto.
      - client-id: web-client
        client-name: Frontend web
        grant-types: authorization_code,refresh_token
        redirect-uris: ${WEB_CLIENT_REDIRECT_URIS:http://127.0.0.1:3000/callback}
        scopes: openid,profile
      # Llamadas entre microservicios: client_credentials. Si no hay secreto, no se registra.
      - client-id: internal-service
        client-name: Comunicación entre microservicios
        secret: ${INTERNAL_CLIENT_SECRET:}
        grant-types: client_credentials
        scopes: internal

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
