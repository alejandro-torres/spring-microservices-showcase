server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful
  # Honors the gateway's X-Forwarded-* headers (Swagger URLs, Location of 201s...).
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: auth-service
  messages:
    # messages.properties is in English; without this a server in another language would use its locale as a fallback.
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Loads collections (roles, permissions) in batches to avoid the N+1 problem when paginating
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # guest/guest only works locally; in docker-compose each service has its own user.
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # The outbox only considers an event sent if RabbitMQ confirms it has received it (confirm) and that it had
    # a destination queue (return with mandatory).
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

showcase:
  messaging:
    source: ${spring.application.name}
    # auth-service only publishes: it consumes no queue.
    exchange: auth.events
  security:
    issuer: ${AUTH_ISSUER:http://localhost:9000}
    access-token-ttl: 15m
    refresh-token-ttl: 8h
    jwt:
      # RSA keys in PEM (PKCS#8 and X.509). Mandatory with several replicas; without them a pair is generated in memory.
      key-id: ${JWT_KEY_ID:showcase-key}
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
    clients:
      # Browser frontend: authorization_code with PKCE, no secret.
      - client-id: web-client
        client-name: Frontend web
        grant-types: authorization_code,refresh_token
        # The second is the login of the gateway's Swagger UI. They are compared exactly: with another host or port, change them.
        redirect-uris: ${WEB_CLIENT_REDIRECT_URIS:http://127.0.0.1:3000/callback,http://localhost:8080/swagger-ui/oauth2-redirect.html}
        scopes: openid,profile
      # Calls between microservices: client_credentials. If there is no secret, it is not registered.
      - client-id: internal-service
        client-name: Communication between microservices
        secret: ${INTERNAL_CLIENT_SECRET:}
        grant-types: client_credentials
        scopes: internal

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Replica list refreshed every 5 s (30 s by default).
    registry-fetch-interval-seconds: 5
  instance:
    # Unique id of each replica, computed once at startup (common-lib); it is the same as the
    # X-Instance-Id header of the responses.
    instance-id: ${showcase.instance-id}
    prefer-ip-address: true
    # Heartbeat every 5 s; if missing for 15 s, Eureka removes the replica.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    # Prometheus discovers the replicas in Eureka and reads here which port their metrics are on.
    metadata-map:
      prometheus-port: ${management.server.port:${server.port}}

# Each SQL query is a span in Zipkin (without the parameter values, which may be personal data).
jdbc:
  includes: connection, query
  datasource-proxy:
    include-parameter-values: false

management:
  metrics:
    # Common tags of all metrics: service, replica (the same as X-Instance-Id) and environment.
    tags:
      application: ${spring.application.name}
      instance: ${showcase.instance-id}
      environment: ${ENVIRONMENT:dev}
    distribution:
      # Latency histogram to compute p50/p95/p99 in Prometheus; with traces, each bucket carries an
      # exemplar with the traceId of a real request (to jump from the chart to Zipkin).
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    annotations:
      # Custom spans with @Observed in the key use cases (visible in Zipkin within the request).
      enabled: true
  tracing:
    sampling:
      # 10 % by default (prod); the dev profile samples 100 %.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Structured logs (when enabled with logging.structured.format.console=ecs, as in Docker and prod):
# each line is a JSON with the service, the replica, the environment and the request's traceId/spanId.
logging:
  structured:
    ecs:
      service:
        node-name: ${showcase.instance-id}
        environment: ${ENVIRONMENT:dev}

---
# In Kubernetes there is no Eureka: the other services find the replicas with the Kubernetes API (Services and
# their endpoints), so this service does not have to register anywhere.
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
eureka:
  client:
    enabled: false
