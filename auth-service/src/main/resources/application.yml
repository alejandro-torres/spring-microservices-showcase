server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful
  # Respeta las cabeceras X-Forwarded-* del gateway (URLs de Swagger, Location de los 201...).
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: auth-service
  messages:
    # messages.properties está en español; sin esto un servidor en otro idioma usaría su locale como respaldo.
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Carga las colecciones (roles, permisos) en lotes para evitar el problema N+1 al paginar
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # guest/guest solo sirve en local; en docker-compose cada servicio tiene su propio usuario.
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # El outbox solo da un evento por enviado si RabbitMQ confirma que lo ha recibido (confirm) y que tenía
    # una cola de destino (return con mandatory).
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

showcase:
  messaging:
    source: ${spring.application.name}
    # auth-service solo publica: no consume ninguna cola.
    exchange: auth.events
  security:
    issuer: ${AUTH_ISSUER:http://localhost:9000}
    access-token-ttl: 15m
    refresh-token-ttl: 8h
    jwt:
      # Claves RSA en PEM (PKCS#8 y X.509). Obligatorias con varias réplicas; sin ellas se genera un par en memoria.
      key-id: ${JWT_KEY_ID:showcase-key}
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
    clients:
      # Frontend de navegador: authorization_code con PKCE, sin secreto.
      - client-id: web-client
        client-name: Frontend web
        grant-types: authorization_code,refresh_token
        # La segunda es el login del Swagger UI del gateway. Se comparan exactamente: con otro host o puerto, cámbialas.
        redirect-uris: ${WEB_CLIENT_REDIRECT_URIS:http://127.0.0.1:3000/callback,http://localhost:8080/swagger-ui/oauth2-redirect.html}
        scopes: openid,profile
      # Llamadas entre microservicios: client_credentials. Si no hay secreto, no se registra.
      - client-id: internal-service
        client-name: Comunicación entre microservicios
        secret: ${INTERNAL_CLIENT_SECRET:}
        grant-types: client_credentials
        scopes: internal

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Lista de réplicas refrescada cada 5 s (por defecto 30 s).
    registry-fetch-interval-seconds: 5
  instance:
    # Id único de cada réplica, calculado una vez al arrancar (common-lib); es el mismo que la cabecera
    # X-Instance-Id de las respuestas.
    instance-id: ${showcase.instance-id}
    prefer-ip-address: true
    # Latido cada 5 s; si faltan durante 15 s, Eureka retira la réplica.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    # Prometheus descubre las réplicas en Eureka y lee aquí en qué puerto están sus métricas.
    metadata-map:
      prometheus-port: ${management.server.port:${server.port}}

# Cada consulta SQL es un span en Zipkin (sin los valores de los parámetros, que pueden ser datos personales).
jdbc:
  includes: connection, query
  datasource-proxy:
    include-parameter-values: false

management:
  metrics:
    # Etiquetas comunes de todas las métricas: servicio, réplica (la misma de X-Instance-Id) y entorno.
    tags:
      application: ${spring.application.name}
      instance: ${showcase.instance-id}
      environment: ${ENVIRONMENT:dev}
    distribution:
      # Histograma de latencias para calcular p50/p95/p99 en Prometheus; con trazas, cada cubo lleva un
      # exemplar con el traceId de una petición real (para saltar de la gráfica a Zipkin).
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    annotations:
      # Spans propios con @Observed en los casos de uso clave (se ven en Zipkin dentro de la petición).
      enabled: true
  tracing:
    sampling:
      # 10 % por defecto (prod); el perfil dev muestrea el 100 %.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Logs estructurados (cuando se activan con logging.structured.format.console=ecs, como en Docker y en prod):
# cada línea es un JSON con el servicio, la réplica, el entorno y el traceId/spanId de la petición.
logging:
  structured:
    ecs:
      service:
        node-name: ${showcase.instance-id}
        environment: ${ENVIRONMENT:dev}
